<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<title>Forgebound: Idle Realms v0.5</title>
<style>
:root{--bg:#0b0714;--p2:#1d1432;--gold:#f2c14e;--gold2:#b8862b;--text:#efe6d2;--mut:#9d90b5;--red:#d9455f;--mag:#8a6cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#05030a;color:var(--text);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at top,#1b1032,var(--bg));padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;gap:8px;align-items:center;padding:8px 10px}
.pill{background:linear-gradient(#271745,#150e24);border:1px solid var(--gold2);border-radius:14px;padding:6px 12px;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.lvl{flex:1;font-size:14px}
.bar{height:7px;background:#000;border-radius:5px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mag),#c4b3ff);transition:width .25s}
.gold{font-size:18px;color:var(--gold);flex-direction:row;align-items:center;gap:6px}
.icon{width:48px;height:48px;border-radius:14px;border:1px solid var(--gold2);background:var(--p2);font-size:22px}
#stageInfo{text-align:center;padding:0 0 6px;font-size:16px;color:var(--gold);letter-spacing:.5px}
#bossTag{background:var(--red);color:#fff;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:8px;animation:pl 1s infinite alternate}
@keyframes pl{to{box-shadow:0 0 12px var(--red)}}
#game{flex:1;min-height:0;background:#0b0714;border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2);position:relative}
#game canvas{display:block}
.err{padding:20px;text-align:center;color:var(--red)}
#tabs{display:flex;gap:6px;padding:8px 10px 0}
#tabs button{flex:1;min-height:48px;border-radius:12px 12px 0 0;border:1px solid #3a2a5c;border-bottom:0;background:#120a22;font-size:14px;padding:4px 2px}
#tabs .on{background:var(--p2);color:var(--gold);border-color:var(--gold2)}
#panel{height:36%;min-height:200px;max-height:300px;overflow-y:auto;background:var(--p2);border-top:2px solid var(--gold2);padding:10px}
.row{display:flex;align-items:center;gap:10px;background:#120a22;border:1px solid #3a2a5c;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:#241540;border-radius:12px;flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:15px}.inf small{color:var(--mut);font-weight:normal}.inf span{color:var(--mut);font-size:13px}
.buy{min-width:98px;min-height:48px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(#f2c14e,#b8862b);color:#2a1a05;font-weight:bold;font-size:15px;transition:transform .1s}
.buy:disabled{filter:grayscale(.8) brightness(.45);cursor:default}
.rarity{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:bold}.common{color:#c7c2d0!important}.rare{color:#55b8ff!important}.epic{color:#c18aff!important}.legendary{color:#ffd24a!important}
.buy:active:not(:disabled){transform:scale(.95)}
.st{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #2c2048;font-size:15px}.st b{color:var(--gold)}
#toast{position:absolute;left:50%;top:128px;transform:translate(-50%,-10px);background:#000c;border:1px solid var(--gold);padding:8px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:5;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:#05030ad9;display:grid;place-items:center;z-index:10;padding:20px}
.card{width:100%;background:linear-gradient(#271745,#150e24);border:2px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 0 40px #8a6cff55;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 8px;color:var(--gold);text-align:center}.card p{color:var(--mut);text-align:center;margin:0 0 12px}
.cta{width:100%;min-height:54px;margin-top:14px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(#f2c14e,#b8862b);color:#2a1a05;font-weight:bold;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <header id="hud">
  <div class="pill lvl"><b>Héroe · Nv <span id="hLvl">1</span></b><div class="bar"><i id="xpBar"></i></div></div>
  <div class="pill gold">🪙 <b id="gold">0</b></div>
  <div class="pill gold" style="font-size:15px;color:#c5a7ff">💎 <b id="shards">0</b></div>
  <button id="snd" class="icon" aria-label="Activar o desactivar sonido">🔊</button>
 </header>
 <div id="stageInfo"><span id="stageTxt">Nivel 1</span><span id="bossTag" hidden>JEFE</span></div>
 <main id="game"></main>
 <nav id="tabs"><button data-t="shop" class="on">⚒️ Mejoras</button><button data-t="relics">💎 Reliquias</button><button data-t="stats">📜 Héroe</button></nav>
 <section id="panel"><div id="shop"></div><div id="relics" hidden></div><div id="stats" hidden></div></section>
 <div id="toast"></div>
 <div id="modal" hidden><div class="card"><h2>¡Bienvenido de nuevo!</h2><p id="mAway"></p><div id="mRows"></div><button id="claim" class="cta">Continuar</button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
'use strict';
/* =====================================================================
   FORGEBOUND: IDLE REALMS — actualización v0.5.1
   Arquitectura (preparada para Capacitor):
   - Platform: capa de servicios. Sustituir storage por @capacitor/preferences,
     y rellenar ads/iap en el futuro. Hoy ads/iap NO hacen nada.
   - Save / G / UI: lógica y estado, independientes de Phaser.
   - Battle: escena Phaser (solo dibuja y ejecuta el combate).
   ===================================================================== */
const Platform={
 // Contrato asíncrono: get(key) -> string|null ; set(key,value)
 storage:{async get(k){return localStorage.getItem(k)},async set(k,v){localStorage.setItem(k,v)}},
 ads:{available:()=>false,async showRewarded(){return{shown:false}}},        // futuro: publicidad recompensada
 iap:{available:()=>false,async purchase(){return{ok:false}},async restore(){return{ok:false}}} // futuro: compras
};

const $=id=>document.getElementById(id);
const KEY='forgebound_save_v1',BAK=KEY+'_bak';
const WAVES=5,OFFLINE_MAX=8*3600,OFFLINE_MIN=30,OFFLINE_EFF=.5;
const fmt=n=>{n=Math.floor(n);if(!(n>=1e3))return''+(n||0);const u=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1e3&&i<5){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]};
const fmtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+' h ':'')+m+' min'};

/* ---------- Datos y fórmulas (v0.4.1: defaults y migración seguros) ---------- */
const UPG={
 dmg:{n:'Daño',ic:'⚔️',base:10,g:1.15,v:c=>fmt(c.dmg)},
 hp:{n:'Vida',ic:'❤️',base:10,g:1.15,v:c=>fmt(c.hp)},
 spd:{n:'Vel. de ataque',ic:'⚡',base:25,g:1.2,max:38,v:c=>c.spd.toFixed(2)+'/s'},
 gold:{n:'Ganancia de oro',ic:'💰',base:50,g:1.25,v:c=>'x'+c.gm.toFixed(1)},
 crit:{n:'Golpe crítico',ic:'💥',base:100,g:1.3,max:38,v:c=>Math.round(c.crit*100)+'%'}
};
const RELICS={
 sword:{n:'Espada ancestral',ic:'🗡️',desc:'+8% de daño por nivel',stat:'daño'},
 armor:{n:'Armadura del guardián',ic:'🛡️',desc:'+10% de vida por nivel',stat:'vida'},
 amulet:{n:'Amuleto de la fortuna',ic:'📿',desc:'+8% de oro por nivel',stat:'oro'},
 core:{n:'Núcleo arcano',ic:'🔮',desc:'+10% de experiencia por nivel',stat:'experiencia'}
};
const RELIC_RARITY=[{at:0,n:'Común',c:'common'},{at:3,n:'Rara',c:'rare'},{at:7,n:'Épica',c:'epic'},{at:12,n:'Legendaria',c:'legendary'}];
const relicCost=l=>Math.ceil(3*Math.pow(1.65,l));
const rarity=l=>[...RELIC_RARITY].reverse().find(x=>l>=x.at)||RELIC_RARITY[0];
const def=()=>({v:1,gold:0,shards:0,xp:0,lvl:1,stage:1,wave:1,best:1,kills:0,totalGold:0,up:{dmg:0,hp:0,spd:0,gold:0,crit:0},relics:{sword:0,armor:0,amulet:0,core:0},sound:true,last:Date.now()});
function sanitize(o){
 if(!o||typeof o!=='object')return null;
 const d=def(),n=(v,x,min=0)=>(typeof v==='number'&&Number.isFinite(v)&&v>=min)?v:x;
 d.gold=n(o.gold,0);d.shards=n(o.shards,0);d.xp=n(o.xp,0);d.lvl=Math.floor(n(o.lvl,1,1));d.stage=Math.floor(n(o.stage,1,1));
 d.wave=Math.min(WAVES,Math.floor(n(o.wave,1,1)));d.best=Math.max(d.stage,Math.floor(n(o.best,1,1)));d.kills=n(o.kills,0);d.totalGold=n(o.totalGold,0);
 for(const k in d.up){const m=UPG[k].max||1e6;d.up[k]=Math.min(m,Math.floor(n(o.up&&o.up[k],0)))}
 for(const k in d.relics)d.relics[k]=Math.min(20,Math.floor(n(o.relics&&o.relics[k],0)));
 d.sound=o.sound!==false;d.last=n(o.last,Date.now());return d;
}
const calc=(s,up=s.up)=>{const m=1+.04*(s.lvl-1),r=s.relics||{sword:0,armor:0,amulet:0,core:0};return{dmg:(8+3*up.dmg)*m*Math.pow(1.08,r.sword||0),hp:(60+20*up.hp)*m*Math.pow(1.10,r.armor||0),spd:Math.min(4,1+.08*up.spd),gm:(1+.1*up.gold)*Math.pow(1.08,r.amulet||0),xpm:Math.pow(1.10,r.core||0),crit:Math.min(.5,.12+.01*up.crit)}};
const cost=(k,l)=>Math.ceil(UPG[k].base*Math.pow(UPG[k].g,l));
const xpNeed=l=>Math.ceil(20*Math.pow(1.3,l-1));
const isBoss=st=>st%10===0;
const enemyOf=(st,b)=>({hp:Math.ceil(20*Math.pow(1.18,st-1)*(b?4:1)),atk:3*Math.pow(1.14,st-1)*(b?1.4:1),rate:b?1200:1500,gold:Math.ceil(4*Math.pow(1.15,st-1)*(b?10:1)),xp:Math.ceil(3*Math.pow(1.1,st-1)*(b?8:1))});

let S=def(); // estado de la partida
const G={wave:1,addXp(x){S.xp+=x;let n=0;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;n++}return n}};

/* ---------- Guardado (no sobrescribe datos si falla la carga) ---------- */
const Save={ok:true,prev:null,
 async load(){
  let raw=null;
  try{raw=await Platform.storage.get(KEY)}catch(e){Save.ok=false;return def()}
  if(raw==null)return def();
  try{const s=sanitize(JSON.parse(raw));if(s){Save.prev=raw;return s}}catch(e){}
  try{await Platform.storage.set(KEY+'_corrupt',raw)}catch(e){}      // conserva copia del dato dañado
  try{const b=await Platform.storage.get(BAK);if(b){const s=sanitize(JSON.parse(b));if(s){Save.prev=b;return s}}}catch(e){}
  return def();
 },
 async save(){
  try{
   S.last=Date.now();S.wave=G.wave;const j=JSON.stringify(S),p=Save.prev;
   const w=Platform.storage.set(KEY,j);
   if(p)Platform.storage.set(BAK,p).catch(()=>{});
   Save.prev=j;await w;Save.ok=true;
  }catch(e){Save.ok=false}
 }
};

/* ---------- Sonido (WebAudio, sin archivos) ---------- */
const Snd={ctx:null,
 init(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
 beep(f,d=.1,ty='square',v=.05,sl=0){
  if(!S.sound||!this.ctx)return;
  try{const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}catch(e){}
 },
 hit(){this.beep(220,.08,'square',.05,-120)},hurt(){this.beep(110,.15,'sawtooth',.06,-50)},
 coin(){this.beep(880,.08,'triangle',.06);setTimeout(()=>this.beep(1320,.1,'triangle',.06),70)},
 up(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,.15,'triangle',.07),i*90))},
 buy(){this.beep(600,.1,'sine',.07,300)}
};

/* ---------- Offline v0.5: combate, progresión y bonus de reliquias ---------- */
function offline(raw){
 const sec=Math.min(raw,OFFLINE_MAX),c=calc(S),maxHp=c.hp;
 let left=sec,stage=S.stage,wave=G.wave,hp=Math.min(maxHp,maxHp),kills=0,bosses=0,deaths=0,gold=0,xp=0,shards=0;
 const startStage=stage,startWave=wave;
 // Simula combates completos con las mismas estadísticas base que el combate activo.
 // Se limita el tiempo a 8 h y los intentos de muerte para evitar bucles infinitos.
 while(left>0.05&&kills<100000&&deaths<5){
  const boss=isBoss(stage),total=boss?1:WAVES,e=enemyOf(stage,boss);
  const expectedDmg=c.dmg*(1+c.crit);
  const killTime=e.hp/(expectedDmg*c.spd)+.8;
  const hitEvery=e.rate/1000,hitCount=Math.max(1,Math.ceil(killTime/hitEvery));
  const incoming=hitCount*e.atk;
  const deathTime=hp/(e.atk/hitEvery);
  if(incoming>=hp){
   if(left<deathTime)break;
   left-=deathTime+2;deaths++;stage=Math.max(1,stage-1);wave=1;hp=maxHp;
   continue;
  }
  if(left<killTime)break;
  left-=killTime;hp=Math.min(maxHp,hp-incoming+maxHp*.15);
  const earned=Math.ceil(e.gold*c.gm);gold+=earned;xp+=e.xp*c.xpm;kills++;
  if(boss){bosses++;shards+=8+Math.floor(stage/10);}else if(stage>=20&&wave%5===0){shards++;}
  wave++;
  if(wave>total){stage++;wave=1;hp=maxHp;}
 }
 const lv=(()=>{let count=0;S.xp+=xp;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;count++}return count})();
 return{sec,capped:raw>OFFLINE_MAX,kills,bosses,deaths,gold,xp,shards,levels:lv,startStage,startWave,endStage:stage,endWave:wave,remaining:Math.max(0,left)};
}
function checkAway(){
 const now=Date.now(),raw=Math.max(0,(now-S.last)/1000);S.last=now;
 if(raw>=OFFLINE_MIN&&$('modal').hidden){
  const r=offline(raw);
  S.gold+=r.gold;S.totalGold+=r.gold;S.shards+=r.shards;S.kills+=r.kills;S.stage=r.endStage;G.wave=r.endWave;S.wave=G.wave;S.best=Math.max(S.best,S.stage);
  {
   $('mAway').textContent='Estuviste fuera '+fmtT(r.sec)+(r.capped?' (máximo 8 h)':'')+'. Tu héroe ha seguido combatiendo y progresando.';
   const rows=[['🪙 Oro','+'+fmt(r.gold)],['💎 Fragmentos de jefe','+'+fmt(r.shards)],['✨ Experiencia','+'+fmt(r.xp)],['💀 Enemigos derrotados',fmt(r.kills)],['👑 Jefes derrotados',fmt(r.bosses)],['⚔️ Oleadas al regresar','Nivel '+r.endStage+' · Oleada '+r.endWave],['📍 Progreso inicial','Nivel '+r.startStage+' · Oleada '+r.startWave]];
   if(r.levels)rows.push(['⭐ Niveles de héroe','+'+r.levels]);
   if(r.deaths)rows.push(['💔 Derrotas sufridas',fmt(r.deaths)]);
   if(r.capped)rows.push(['⏱️ Límite offline','8 horas']);
   $('mRows').innerHTML=rows.map(a=>'<div class="st"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');
   $('modal').hidden=false;
  }
 }
 UI.refresh();Save.save();
}

/* ---------- Interfaz HTML ---------- */
function buy(k){
 const l=S.up[k],c=cost(k,l);
 if(S.gold<c||(UPG[k].max&&l>=UPG[k].max))return;
 S.gold-=c;S.up[k]++;Snd.buy();Save.save();UI.refresh();
}
function buyRelic(k){
 const l=S.relics[k],c=relicCost(l);
 if(S.shards<c||l>=20)return;
 S.shards-=c;S.relics[k]++;Snd.buy();Save.save();UI.refresh();
 UI.toast(RELICS[k].n+' mejorada · '+rarity(S.relics[k]).n);
}
const UI={
 init(){
  $('shop').innerHTML=Object.keys(UPG).map(k=>'<div class="row" data-k="'+k+'"><div class="ic">'+UPG[k].ic+'</div><div class="inf"><b>'+UPG[k].n+' <small></small></b><span></span></div><button class="buy">🪙 <b></b></button></div>').join('');
  $('shop').addEventListener('click',e=>{const b=e.target.closest('.buy');if(b&&!b.disabled)buy(b.closest('.row').dataset.k)});
  $('relics').innerHTML='<div style="color:var(--mut);font-size:13px;padding:2px 4px 10px">Derrota jefes para conseguir fragmentos. Cada reliquia cuesta 3 fragmentos en su primer nivel.</div>'+Object.keys(RELICS).map(k=>'<div class="row" data-r="'+k+'"><div class="ic">'+RELICS[k].ic+'</div><div class="inf"><b>'+RELICS[k].n+' <small></small></b><span></span></div><button class="buy">💎 <b></b></button></div>').join('');
  $('relics').addEventListener('click',e=>{const b=e.target.closest('.buy');if(b&&!b.disabled)buyRelic(b.closest('.row').dataset.r)});
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
   document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
   $('shop').hidden=b.dataset.t!=='shop';$('relics').hidden=b.dataset.t!=='relics';$('stats').hidden=b.dataset.t!=='stats';UI.refresh();
  });
  $('snd').onclick=()=>{S.sound=!S.sound;Snd.init();if(S.sound)Snd.buy();UI.refresh();Save.save()};
  $('claim').onclick=()=>{$('modal').hidden=true};
 },
 toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(UI._t);UI._t=setTimeout(()=>t.classList.remove('show'),2200)},
 refresh(){
  const c=calc(S),tot=isBoss(S.stage)?1:WAVES;
  $('gold').textContent=fmt(S.gold);$('shards').textContent=fmt(S.shards);$('hLvl').textContent=S.lvl;
  $('xpBar').style.width=Math.min(100,100*S.xp/xpNeed(S.lvl))+'%';
  $('snd').textContent=S.sound?'🔊':'🔇';
  $('stageTxt').textContent='Nivel '+S.stage+' · Oleada '+Math.min(G.wave,tot)+'/'+tot;
  $('bossTag').hidden=!isBoss(S.stage);
  document.querySelectorAll('#shop .row').forEach(r=>{
   const k=r.dataset.k,u=UPG[k],l=S.up[k],cs=cost(k,l),maxed=u.max&&l>=u.max;
   r.querySelector('small').textContent='Nv '+l;
   r.querySelector('span').textContent=maxed?u.v(c)+' (máximo)':u.v(c)+' → '+u.v(calc(S,{...S.up,[k]:l+1}));
   const b=r.querySelector('.buy');b.querySelector('b').textContent=maxed?'MÁX':fmt(cs);b.disabled=maxed||S.gold<cs;
  });
  document.querySelectorAll('#relics .row').forEach(r=>{
   const k=r.dataset.r,l=S.relics[k],u=RELICS[k],rr=rarity(l),next=rarity(Math.min(20,l+1)),cs=relicCost(l),maxed=l>=20;
   r.querySelector('small').innerHTML='Nv '+l+' · <span class="rarity '+rr.c+'">'+rr.n+'</span>';
   r.querySelector('span').textContent=u.desc+(l?' · Bonus actual: '+Math.round(((k==='sword'||k==='amulet'?1.08:1.10)**l-1)*100)+'%':'');
   const b=r.querySelector('.buy');b.querySelector('b').textContent=maxed?'MÁX':fmt(cs);b.disabled=maxed||S.shards<cs;
  });
  if(!$('stats').hidden){
   const rows=[['Nivel del héroe',S.lvl],['Experiencia',fmt(S.xp)+' / '+fmt(xpNeed(S.lvl))],['Daño',fmt(c.dmg)],['Vida máxima',fmt(c.hp)],['Velocidad de ataque',c.spd.toFixed(2)+'/s'],['Daño por segundo',fmt(c.dmg*c.spd)],['Bonus de oro','x'+c.gm.toFixed(2)],['Bonus de experiencia','x'+c.xpm.toFixed(2)],['Probabilidad de crítico',Math.round(c.crit*100)+'%'],['Fragmentos de jefe',fmt(S.shards)],['Nivel más alto',S.best],['Enemigos derrotados',fmt(S.kills)],['Oro total ganado',fmt(S.totalGold)],['Guardado automático',Save.ok?'Activo ✓':'No disponible']];
   $('stats').innerHTML=rows.map(a=>'<div class="st"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');
  }
 }
};

/* ---------- Escena de combate (Phaser) ---------- */
const NAMES=['Limo Umbrío','Trasgo Rapaz','Espectro Errante'];
const BOSS=[{n:'Señor Cornamenta',c:0x7d1230},{n:'Reina Ceniza',c:0x3c3c8e},{n:'Coloso Ígneo',c:0xa8480f},{n:'Rey Sombrío',c:0x2a6a5a}];
const W=360,H=380,GY=305;

class Battle extends Phaser.Scene{
 constructor(){super('battle')}
 create(){
  const R=Phaser.Math.Between,g=this.add.graphics();
  g.fillGradientStyle(0x120826,0x120826,0x3b1a52,0x3b1a52,1).fillRect(0,0,W,H);
  for(let i=0;i<40;i++){const s=this.add.circle(R(0,W),R(0,190),Math.random()*1.2+.4,0xffffff,.8);this.tweens.add({targets:s,alpha:.15,duration:R(900,2500),yoyo:true,repeat:-1,delay:R(0,1500)})}
  this.add.circle(290,70,28,0xf2c14e,.18);this.add.circle(290,70,16,0xf6dc8a,.9);
  g.fillStyle(0x1b1035).fillTriangle(-30,GY,90,190,210,GY).fillTriangle(130,GY,260,160,400,GY);
  g.fillStyle(0x140a28).fillRect(150,GY-90,20,90).fillRect(175,GY-70,36,70).fillRect(215,GY-100,18,100)
   .fillTriangle(146,GY-90,174,GY-90,160,GY-116).fillTriangle(211,GY-70,175,GY-70,193,GY-96).fillTriangle(211,GY-100,237,GY-100,224,GY-126);
  g.fillStyle(0xf2c14e,.7).fillRect(158,GY-60,4,7).fillRect(190,GY-45,4,7).fillRect(222,GY-70,4,7);
  g.fillStyle(0x0e0719).fillRect(0,GY,W,H-GY);g.lineStyle(2,0xf2c14e,.6).lineBetween(0,GY,W,GY);
  const rune=this.add.ellipse(95,GY+8,90,14,0x8a6cff,.4);this.tweens.add({targets:rune,alpha:.15,duration:1200,yoyo:true,repeat:-1});
  const t=this.make.graphics({add:false});t.fillStyle(0xffffff).fillCircle(4,4,4);t.generateTexture('spark',8,8);t.destroy();
  this.add.particles(0,H,'spark',{x:{min:0,max:W},lifespan:5000,speedY:{min:-25,max:-55},scale:{start:.6,end:0},alpha:{start:.7,end:0},tint:[0xf2c14e,0x8a6cff],frequency:220,blendMode:'ADD'}).setDepth(1);
  const mk=c=>this.add.particles(0,0,'spark',{emitting:false,lifespan:500,speed:{min:70,max:190},scale:{start:1,end:0},tint:c,blendMode:'ADD'}).setDepth(15);
  this.fx={hit:mk(0xffe9a8),hurt:mk(0xff5577),mag:mk(0xa58bff),coin:mk(0xf2c14e)};
  this.makeHero();
  this.bars=this.add.graphics().setDepth(10);
  const ts=(sz,col)=>this.add.text(0,0,'',{fontFamily:'Georgia',fontSize:sz+'px',color:col,stroke:'#000',strokeThickness:3}).setOrigin(.5).setDepth(11);
  this.hTxt=ts(11,'#ffffff');this.eName=ts(13,'#efe6d2');this.eHp=ts(11,'#ffffff');
  this.c=calc(S);this.hp=this.lastMax=this.c.hp;
  G.onLevel=()=>this.levelFx();
  this.spawn();
 }
 makeHero(){
  const h=this.hero=this.add.container(95,GY).setDepth(5),g=this.add.graphics();
  g.fillStyle(0x7a1d3c).fillTriangle(-8,-52,-26,-6,-4,-12);
  g.fillStyle(0x3b3350).fillRect(-9,-18,7,18).fillRect(2,-18,7,18);
  g.fillStyle(0x8e93a8).fillRoundedRect(-11,-48,22,32,5);
  g.fillStyle(0xf2c14e).fillRect(-11,-24,22,4).fillRect(-3,-44,6,10);
  g.fillStyle(0xb7bccc).fillCircle(0,-58,10);g.fillStyle(0x1a1030).fillRect(-1,-60,10,3);
  g.fillStyle(0xf2c14e).fillTriangle(-3,-66,3,-66,0,-79);
  const sw=this.sw=this.add.container(10,-36),sg=this.add.graphics();
  sg.fillStyle(0xdfe6ff).fillRect(-2,-38,4,32);sg.fillStyle(0x8a6cff).fillRect(-1,-38,2,32);
  sg.fillStyle(0xf2c14e).fillRect(-7,-7,14,3);sg.fillStyle(0x5a3a22).fillRect(-1.5,-4,3,9);
  sw.add(sg);sw.rotation=.35;h.add([g,sw]);
  this.tweens.add({targets:h,scaleY:1.03,duration:700,yoyo:true,repeat:-1,ease:'Sine.inOut'});
 }
 drawEnemy(type,col){
  const c=this.add.container(W+90,GY).setDepth(5),g=this.add.graphics();c.add(g);
  const eye=(x,y)=>{g.fillStyle(0xffffff).fillCircle(x,y,4);g.fillStyle(0x111111).fillCircle(x-1,y,2)};
  if(type===0){g.fillStyle(0x3fae6a).fillEllipse(0,-18,58,38);g.fillStyle(0x7be8a0,.6).fillEllipse(-10,-26,18,10);eye(-9,-22);eye(9,-22);g.fillStyle(0x111111).fillRect(-5,-11,10,3)}
  else if(type===1){g.fillStyle(0x5a3a22).fillRoundedRect(-12,-34,24,26,4);g.fillStyle(0x2d1c10).fillRect(-10,-10,7,10).fillRect(3,-10,7,10);
   g.fillStyle(0x6fae4a).fillCircle(0,-46,13).fillTriangle(-12,-50,-27,-58,-11,-42).fillTriangle(12,-50,27,-58,11,-42);
   g.fillStyle(0xff3355).fillCircle(-5,-47,2.5).fillCircle(5,-47,2.5);g.fillStyle(0x4a3a2a).fillRect(-27,-32,4,30);g.fillStyle(0x6b4a2a).fillCircle(-25,-36,7)}
  else if(type===2){g.fillStyle(0x7a5cff,.85).fillCircle(0,-42,20).fillRect(-20,-42,40,26).fillTriangle(-20,-16,-7,-16,-13,2).fillTriangle(-7,-16,7,-16,0,7).fillTriangle(7,-16,20,-16,13,2);
   g.fillStyle(0x00ffe0).fillCircle(-7,-44,3.5).fillCircle(7,-44,3.5);g.fillStyle(0x120826).fillEllipse(0,-33,10,8)}
  else{g.fillStyle(col).fillRoundedRect(-24,-62,48,52,8).fillCircle(0,-74,17).fillRect(-31,-56,10,30).fillRect(21,-56,10,30).fillRect(-18,-12,13,12).fillRect(5,-12,13,12);
   g.fillStyle(0xe8d9b0).fillTriangle(-15,-84,-5,-82,-22,-108).fillTriangle(15,-84,5,-82,22,-108);
   g.fillStyle(0xffd24a).fillCircle(-7,-76,3.5).fillCircle(7,-76,3.5);g.fillStyle(0x120826).fillRect(-8,-66,16,4);g.fillStyle(0xf2c14e).fillRect(-24,-34,48,4);c.setScale(1.5)}
  return c;
 }
 spawn(){
  const st=S.stage,boss=isBoss(st),e=enemyOf(st,boss),bi=boss?(st/10-1)%BOSS.length:0,type=boss?3:(st+G.wave)%3;
  const node=this.drawEnemy(type,boss?BOSS[bi].c:0),bx=boss?248:262;
  this.en={...e,max:e.hp,node,boss,bx};
  this.eName.setText(boss?BOSS[bi].n:NAMES[type]).setColor(boss?'#f2c14e':'#efe6d2');
  this.mode='spawn';this.ht=0;this.et=-500;
  this.tweens.add({targets:node,x:bx,duration:500,ease:'Quad.out',onComplete:()=>{if(this.mode==='spawn')this.mode='fight'}});
  if(type===2&&!boss)this.tweens.add({targets:node,y:GY-10,duration:900,yoyo:true,repeat:-1,ease:'Sine.inOut'});
  UI.refresh();
 }
 pop(x,y,txt,color,size=18){
  const t=this.add.text(x,y,txt,{fontFamily:'Georgia',fontSize:size+'px',fontStyle:'bold',color,stroke:'#000',strokeThickness:4}).setOrigin(.5).setDepth(20);
  this.tweens.add({targets:t,y:y-45,alpha:0,duration:850,onComplete:()=>t.destroy()});
 }
 update(time,dt){
  dt=Math.min(dt,250);const c=this.c=calc(S);
  if(c.hp>this.lastMax)this.hp+=c.hp-this.lastMax;this.lastMax=c.hp;this.hp=Math.min(this.hp,c.hp);
  if(this.mode==='fight'&&this.en){
   this.ht+=dt;this.et+=dt;
   if(this.ht>=1000/c.spd){this.ht=0;this.heroAttack(c)}
   if(this.en&&this.et>=this.en.rate){this.et=0;this.enemyAttack()}
  }
  this.drawBars();
 }
 bar(x,y,w,f,col){const b=this.bars;f=Phaser.Math.Clamp(f,0,1);b.fillStyle(0,.75).fillRect(x-2,y-2,w+4,12);b.fillStyle(col).fillRect(x,y,w*f,8);b.lineStyle(1,0xf2c14e,.9).strokeRect(x-2,y-2,w+4,12)}
 drawBars(){
  this.bars.clear();const c=this.c;
  this.bar(55,GY-98,80,this.hp/c.hp,0x5fd08a);this.hTxt.setPosition(95,GY-107).setText(fmt(Math.max(0,this.hp))+' / '+fmt(c.hp));
  const e=this.en;
  if(e&&this.mode!=='dead'){const n=e.node,w=e.boss?120:90,y=GY-(e.boss?184:104);
   this.bar(n.x-w/2,y,w,e.hp/e.max,0xd9455f);this.eName.setPosition(n.x,y-12).setVisible(true);this.eHp.setPosition(n.x,y+18).setText(fmt(Math.max(0,e.hp))+' / '+fmt(e.max)).setVisible(true)}
  else{this.eName.setVisible(false);this.eHp.setVisible(false)}
 }
 heroAttack(c){
  const e=this.en,crit=Math.random()<c.crit,d=Math.max(1,Math.round(c.dmg*(crit?2:1)*(.9+Math.random()*.2)));
  e.hp-=d;
  this.tweens.add({targets:this.sw,rotation:1.9,duration:80,yoyo:true,ease:'Quad.out',onComplete:()=>this.sw.rotation=.35});
  this.tweens.add({targets:this.hero,x:112,duration:70,yoyo:true,onComplete:()=>this.hero.x=95});
  this.tweens.add({targets:e.node,x:e.bx+7,duration:45,yoyo:true,onComplete:()=>{if(e.node.active)e.node.x=e.bx}});
  this.fx.hit.emitParticleAt(e.node.x-10,GY-40,crit?14:7);
  this.pop(e.node.x,GY-(e.boss?150:90),crit?fmt(d)+'!':fmt(d),crit?'#ffd24a':'#ffffff',crit?26:18);
  Snd.hit();
  if(e.hp<=0)this.kill(c);
 }
 enemyAttack(){
  const e=this.en,d=Math.max(1,Math.round(e.atk*(.9+Math.random()*.2)));
  this.hp-=d;
  this.tweens.add({targets:e.node,x:e.bx-28,duration:100,yoyo:true,onComplete:()=>{if(e.node.active)e.node.x=e.bx}});
  this.tweens.add({targets:this.hero,alpha:.4,duration:60,yoyo:true,onComplete:()=>{if(this.mode!=='dead')this.hero.alpha=1}});
  this.fx.hurt.emitParticleAt(this.hero.x,GY-40,6);this.pop(this.hero.x,GY-85,'-'+fmt(d),'#ff6680');Snd.hurt();
  if(this.hp<=0)this.die();
 }
 kill(c){
  const e=this.en;this.en=null;this.mode='clear';
  const g=Math.ceil(e.gold*c.gm);S.gold+=g;S.totalGold+=g;S.kills++;
  if(e.boss){const reward=8+Math.floor(S.stage/10);S.shards+=reward;this.pop(e.node.x,GY-110,'+'+reward+' fragmentos','#c5a7ff',18);}else if(S.stage>=20&&G.wave%5===0){S.shards++;this.pop(e.node.x,GY-105,'+1 fragmento','#c5a7ff',16);}
  const lv=G.addXp(e.xp*c.xpm),n=e.node;
  this.pop(n.x,GY-65,'+'+fmt(g)+' oro','#f2c14e',20);this.fx.coin.emitParticleAt(n.x,GY-40,12);Snd.coin();
  this.hp=Math.min(c.hp,this.hp+c.hp*.15);
  this.tweens.killTweensOf(n);
  this.tweens.add({targets:n,alpha:0,scale:n.scale*.3,y:n.y-20,duration:350,onComplete:()=>n.destroy()});
  if(lv)this.levelFx();
  this.time.delayedCall(500,()=>this.advance());
  UI.refresh();
 }
 advance(){
  const was=S.stage,tot=isBoss(was)?1:WAVES;
  if(++G.wave>tot){
   S.stage++;G.wave=1;S.wave=1;S.best=Math.max(S.best,S.stage);this.hp=this.c.hp;
   UI.toast(isBoss(was)?'¡Jefe derrotado!':isBoss(S.stage)?'⚠️ ¡Llega un jefe!':'¡Nivel '+was+' completado!');Save.save();
  }
  this.spawn();
 }
 die(){
  this.mode='dead';const n=this.en&&this.en.node;
  this.pop(this.hero.x,GY-110,'¡Derrotado!','#ff6680',26);
  this.tweens.add({targets:this.hero,angle:-80,y:GY+6,duration:400,delay:150});
  if(n){this.tweens.killTweensOf(n);this.tweens.add({targets:n,alpha:0,duration:600})}
  this.time.delayedCall(2000,()=>{
   if(n)n.destroy();this.en=null;
   if(S.stage>1)S.stage--;G.wave=1;S.wave=1;UI.toast('Retrocedes al nivel '+S.stage);
   this.hp=calc(S).hp;this.hero.setAngle(0).setAlpha(1);this.hero.y=GY;Save.save();this.spawn();
  });
 }
 levelFx(){
  this.fx.mag.emitParticleAt(this.hero.x,GY-40,30);this.pop(this.hero.x,GY-125,'¡Nivel '+S.lvl+'!','#a58bff',24);Snd.up();UI.toast('⭐ ¡Tu héroe sube al nivel '+S.lvl+'!');
 }
}

/* ---------- Arranque ---------- */
(async function main(){
 S=await Save.load();
 G.wave=S.wave||1;
 UI.init();
 if(typeof Phaser==='undefined'){$('game').innerHTML='<p class="err">No se pudo cargar Phaser. Comprueba tu conexión a Internet y recarga.</p>';return}
 checkAway();
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#0b0714',
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Battle});
 document.addEventListener('pointerdown',()=>Snd.init(),{passive:true});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)Save.save();else{Snd.init();checkAway()}});
 window.addEventListener('pagehide',()=>Save.save());
 setInterval(()=>Save.save(),5000);
 setInterval(()=>UI.refresh(),250);
})();
</script>
